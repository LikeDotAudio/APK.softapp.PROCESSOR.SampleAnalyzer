# SAMPLE_ANALYZER — the Scanalyzer DSP core (oa-sample-analyzer) as a worker.
# Published to MQTT (retained) by apk-plugin-runner at: APK.audio/System/Protocols/sample_analyzer/config
[sample_analyzer]
enabled = true
# A job arrives on APK.audio/System/Protocols/sample_analyzer/outgoing/job (not
# retained) as JSON: {"job_id": "...", "filename": "kick.wav", "content_b64": "..."}
# with optional "folder" (copied into the record) and "max_len" (seconds).
# The answer goes to APK.audio/System/Protocols/sample_analyzer/incoming/result
# (not retained), carrying the same job_id and the .PEAK record as "result".
# A job whose audio is larger than this many bytes (decoded) is answered with
# an error rather than analysed. 32 MiB holds about three minutes of 48 kHz
# 24-bit stereo WAV.
max_job_bytes = 33554432
# Longer than this many seconds and the record is "preview_only" (metadata and
# waveform, no DSP), as the CLI's --max-len. A job may ask for less, never more.
max_len_s = 600
