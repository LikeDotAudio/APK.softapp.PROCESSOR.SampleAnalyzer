[package]
name = "oa-sample-analyzer"
version = "0.1.0"
edition = "2021"
description = "Fast parallel audio-sample analyzer: envelope, pitch, spectral, UCS class and regions -> .PEAK JSON"

[[bin]]
name = "oa_sample_analyzer"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true

[build-dependencies]
# Used only to minify the UCS bundle as it is spliced. Build-time only: nothing
# here is linked into the analyzer or the WASM engine.
serde_json = "1"

[dependencies]
# The UCS category data (DATATYPE.soundfx.UCS), BY COMMIT. It compiles nothing: its
# `links = "apk_ucs"` hands build.rs the data folder as DEP_APK_UCS_DIR. A NORMAL
# dependency, not a build-dependency, because `links` metadata reaches only the
# build script of a package that depends on the linking package directly. In the
# monorepo the locally excluded .cargo/config.toml patches it to the sibling folder.
apk-ucs-bundle = { git = "https://github.com/LikeDotAudio/APK.softapp.DATATYPE.soundfx.UCS", rev = "f838404d34f3964400cd04610df8417c7db12779" }
# The shared cutting DSP — regions.rs delegates region detection here so the stored .PEAK
# regions and the interactive web Extractor run one implementation (no TS/Rust drift),
# and `extractor_engine::PeakRegion` is the one definition of a .PEAK region.
# BY COMMIT, NOT BY PATH (the house rule for a sibling, .apk.scripts/plugin_standalone.py):
# a clone of this repository builds against exactly this engine. In the monorepo the
# locally excluded .cargo/config.toml patches the URL back to the sibling folder.
# Scanalyzer's wasm_extractor / src-tauri pin the SAME rev (one Region type).
extractor_engine = { git = "https://github.com/LikeDotAudio/APK.softapp.CAPTURE.Extractor-Engine", rev = "e66e6bee0d863adbf94547a615ddbe9fdc431a11" }
hound = "3.5"
rustfft = "6.2"
walkdir = "2.5"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ebur128 = "0.1"
symphonia = { version = "0.5", features = ["mp3", "flac", "aiff", "isomp4", "aac", "alac", "ogg", "vorbis", "wav", "pcm"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2.9", features = ["json"] }

# Its own workspace root: the worker manifest one folder up (SRC/Cargo.toml) is
# another, and this crate is excluded from it.
[workspace]
