# apk-worker-sample-analyzer — the Scanalyzer DSP core as a worker on the bus
# (LOOSE-workers-convert-rest, after PLAN-3423.01's wireless CSV worker).
#
# Owns: the container entry point that answers `outgoing/job` with
# `incoming/result` by running `oa_sample_analyzer::analyze::analyze` — the
# crate one directory up, linked by path, so the CLI, the Tauri app, the WASM
# engine and this worker run one implementation.
#
# BUILT ON apk-plugin-runner, the crate every THICK plugin links: it publishes
# the config, the last will, the self-test door and the retained `incoming/api`
# description; this crate adds only the job loop.
#
# ITS OWN WORKSPACE: a worker builds its own image, so a broken worker never
# fails the plugin build and the reverse.
#
# THE SDK BY TAG, like every THICK plugin (`sdk-v0.9`, APK.plugin.SDK): a clone
# of this repository builds with nothing around it. In the monorepo the locally
# excluded SRC/.cargo/config.toml patches both names back to the local runner and
# contracts at the SAME LEXICAL PATHS the engine workspace uses
# (`…/NODE.BareMetal/SRC/contracts/rust`), or cargo would see two
# apkaudio-contracts packages; the image passes the same two patches as
# `--config` (Docker/Dockerfile), exactly as the broker image does for SQL.
[package]
name = "apk-worker-sample-analyzer"
version = "0.1.0"
edition = "2024"

[workspace]
# The analyzer crate in core/ is its own root (its own Cargo.lock and release
# profile): a path dependency of this worker, not a member of its workspace.
exclude = ["core"]

[lib]
name = "apk_worker_sample_analyzer"
path = "src/lib.rs"

[dependencies]
apk-plugin-runner = { git = "https://github.com/LikeDotAudio/APK.plugin.SDK", tag = "sdk-v0.9" }
apkaudio-contracts = { git = "https://github.com/LikeDotAudio/APK.plugin.SDK", tag = "sdk-v0.9" }
oa-sample-analyzer = { path = "core" }
base64 = "0.22"
rumqttc = "0.24"
serde_json = "1"

[[bin]]
name = "apk-worker-sample-analyzer"
path = "src/bin/apk-worker-sample-analyzer.rs"

# The runner's health probe is the runner's own binary: the image builds it with
# `cargo build -p apk-plugin-runner --bin apk-plugin-health` (no path into the
# runner's source tree from here).

# The analyzer is DSP: unoptimised it is an order of magnitude slower, and the
# worker is only ever run from a release build.
[profile.release]
opt-level = 3
